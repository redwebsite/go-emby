name: go-emby

services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: emby
      POSTGRES_USER: emby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U emby -d emby
      interval: 5s
      timeout: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================================
  # go-emby
  # ==========================================================

  go-emby:
    image: macaemby/go-emby:${IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-8097}:8097"

    environment:

      DATABASE_URL: >-
        postgres://emby:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/emby?sslmode=disable

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}

      LICENSE_KEY: ${LICENSE_KEY:-}

      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://tl.macacaaca.top}

      LICENSE_CA_FILE: ${LICENSE_CA_FILE:-}

      PUBLIC_URL: ${PUBLIC_URL:-}

      PUBLIC_PLAYBACK_URL: ${PUBLIC_PLAYBACK_URL:-}

      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}

      NANSHARE_URL: ${NANSHARE_URL:-http://172.18.0.1:8115}

      XIAOYA_URL: ${XIAOYA_URL:-http://172.18.0.1:5678}

      PROBE_PLAYBACK_URL: ${PROBE_PLAYBACK_URL:-}

      LISTEN: :8097

      MEDIA_INFO_ROOT: /app/data

      FILE_MANAGER_ROOT: /media

      MEDIA_ROOTS: ${MEDIA_ROOTS:-/media}


    volumes:

      # ======================================================
      # go-emby 自身数据
      # ======================================================

      - ./app-data:/app/data

      - ./app-backups:/app/backups


      # ======================================================
      # 媒体目录
      #
      # 格式：
      #
      #   - 本地目录:/容器目录:ro
      #
      # 左边：
      #   Ubuntu / NAS 本地真实目录
      #
      # 右边：
      #   go-emby 容器内部路径
      #
      # ro：
      #   只读挂载，推荐保留
      #
      # 可以继续复制下面的格式添加更多目录。
      # ======================================================


      # 主媒体目录
      - /vol1/1000/strm:/media:ro


      # 电影
      # - /vol1/1000/strm/dy:/movies:ro


      # 电视剧
      # - /vol1/1000/strm/dsj:/tv:ro


      # 动漫
      # - /vol1/1000/strm/dm:/anime:ro


      # 音乐
      # - /vol1/1000/strm/yy:/music:ro


      # ======================================================
      # 更多示例
      #
      # - /data1/media:/data1:ro
      # - /data2/media:/data2:ro
      # - /mnt/115:/115:ro
      # - /mnt/alist:/alist:ro
      #
      # 如果启用了多个容器目录，例如：
      #
      #   /media
      #   /movies
      #   /tv
      #   /anime
      #
      # 请同步修改 .env：
      #
      # MEDIA_ROOTS=/media:/movies:/tv:/anime
      # ======================================================


      # ======================================================
      # 授权机器 ID
      # ======================================================

      - type: bind
        source: /etc/machine-id
        target: /run/license-machine-id
        read_only: true
        bind:
          create_host_path: false


      # ======================================================
      # 私有 CA / secrets
      #
      # 部署时创建：
      #
      #   mkdir -p secrets
      #
      # 如不使用 LICENSE_CA_FILE，
      # secrets 目录可以保持为空。
      # ======================================================

      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false


    stop_grace_period: 45s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
