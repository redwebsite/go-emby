name: Sync GHCR to Docker Hub

on:
  registry_package:
    types:
      - published
      - updated
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sync-go-emby-dockerhub
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.registry_package.name == 'go-emby'
    runs-on: ubuntu-latest

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | skopeo login docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Wait for GHCR manifest
        run: |
          for i in 1 2 3 4 5 6; do
            if skopeo inspect --raw docker://ghcr.io/sd87671067/go-emby:latest >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "GHCR latest image is not ready"
          exit 1

      - name: Copy multi-platform image to Docker Hub
        run: |
          skopeo copy \
            --all \
            --retry-times 5 \
            docker://ghcr.io/sd87671067/go-emby:latest \
            docker://docker.io/macaemby/go-emby:latest

      - name: Verify Docker Hub image
        run: |
          skopeo inspect --raw docker://docker.io/macaemby/go-emby:latest >/dev/null
          echo "Synced successfully: macaemby/go-emby:latest"
