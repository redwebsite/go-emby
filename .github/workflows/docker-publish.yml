name: Sync GHCR to Docker Hub

on:
  push:
    paths:
      - ".github/workflows/docker-publish.yml"
  registry_package:
    types:
      - published
      - updated
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sync-go-emby-dockerhub
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.registry_package.name == 'go-emby'
    runs-on: ubuntu-latest

    steps:
      - name: Install Skopeo and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | skopeo login docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Detect newest dated version and wait for matching latest
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="ghcr.io/sd87671067/go-emby"
          VERSION=""

          for i in $(seq 1 18); do
            VERSION="$(
              skopeo list-tags "docker://${IMAGE}" \
                | jq -r '.Tags[]? | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]{6}$"))' \
                | sort \
                | tail -n 1
            )"

            if [[ -n "${VERSION}" ]]; then
              VERSION_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${VERSION}" 2>/dev/null || true)"
              LATEST_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:latest" 2>/dev/null || true)"

              if [[ -n "${VERSION_DIGEST}" && "${VERSION_DIGEST}" == "${LATEST_DIGEST}" ]]; then
                echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
                echo "Detected release version: ${VERSION}"
                echo "Manifest digest: ${VERSION_DIGEST}"
                exit 0
              fi
            fi

            echo "Waiting for GHCR latest and newest dated tag to point to the same manifest... (${i}/18)"
            sleep 10
          done

          echo "Unable to find a ready dated release tag matching GHCR latest"
          exit 1

      - name: Copy dated multi-platform image to Docker Hub
        run: |
          skopeo copy \
            --all \
            --retry-times 5 \
            "docker://ghcr.io/sd87671067/go-emby:${{ steps.version.outputs.version }}" \
            "docker://docker.io/macaemby/go-emby:${{ steps.version.outputs.version }}"

      - name: Copy latest multi-platform image to Docker Hub
        run: |
          skopeo copy \
            --all \
            --retry-times 5 \
            docker://ghcr.io/sd87671067/go-emby:latest \
            docker://docker.io/macaemby/go-emby:latest

      - name: Verify Docker Hub images
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          skopeo inspect --raw "docker://docker.io/macaemby/go-emby:${VERSION}" >/dev/null
          skopeo inspect --raw docker://docker.io/macaemby/go-emby:latest >/dev/null
          echo "Synced successfully:"
          echo "  macaemby/go-emby:${VERSION}"
          echo "  macaemby/go-emby:latest"

