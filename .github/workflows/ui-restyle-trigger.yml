name: Trigger unified UI theme

on:
  push:
    paths:
      - ".github/workflows/ui-restyle-trigger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract and run existing UI patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/ui-restyle-once.yml').read_text().splitlines()
          start = None
          end = None
          for i, line in enumerate(src):
              if "python3 - <<'PY'" in line:
                  start = i + 1
                  continue
              if start is not None and line.strip() == 'PY':
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('Unable to locate UI patch script')

          body = []
          for line in src[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              body.append(line)
          Path('/tmp/apply-ui.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply-ui.py

      - name: Commit UI theme to main
        shell: bash
        run: |
          if git diff --quiet -- web/index.html; then
            echo "UI theme already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Unify media library and admin UI theme"
          git push origin HEAD:main
