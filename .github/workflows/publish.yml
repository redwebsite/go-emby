name: Source CI only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: emby
          POSTGRES_DB: emby_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emby -d emby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check public repository content
        run: python3 scripts/check-public.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: file-ui/package-lock.json

      - name: Test frontend build
        working-directory: file-ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare media fixtures directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /media

      - name: Run Go tests
        run: go test -count=1 -timeout=15m ./...
        env:
          TEST_DATABASE_URL: postgres://emby:ci-test-password@localhost:5432/emby_test?sslmode=disable
