name: Apply final iOS cinema UI

on:
  push:
    paths:
      - ".github/workflows/ui-v2-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text()
          marker='/* ios-cinema-final */'
          if marker in s:
              raise SystemExit(0)
          css=r'''/* ios-cinema-final */
:root{--c-bg:#090c11;--c-card:rgba(24,29,37,.72);--c-card2:rgba(38,44,54,.86);--c-line:rgba(255,255,255,.11);--c-text:#f7f8fa;--c-muted:#98a2b3;--c-main:#f7f8fa;--c-maintext:#111318;--c-shadow:0 24px 72px rgba(0,0,0,.34);color-scheme:dark}
html[data-theme=light]{--c-bg:#edf1f6;--c-card:rgba(255,255,255,.76);--c-card2:rgba(255,255,255,.92);--c-line:rgba(15,23,42,.10);--c-text:#111827;--c-muted:#667085;--c-main:#111827;--c-maintext:#fff;color-scheme:light}
html,body{background:var(--c-bg)!important;color:var(--c-text)!important}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Segoe UI",sans-serif!important;letter-spacing:-.012em;transition:.2s}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 80% -10%,rgba(90,130,180,.18),transparent 70%),var(--c-bg)}
header{height:66px!important;padding:10px 72px 10px 22px!important;background:rgba(9,12,17,.58)!important;border-bottom:1px solid var(--c-line)!important;backdrop-filter:blur(26px) saturate(170%)!important;-webkit-backdrop-filter:blur(26px) saturate(170%)!important;box-shadow:none!important}html[data-theme=light] header{background:rgba(247,249,252,.70)!important}.logo{color:var(--c-text)!important;font-size:19px!important;font-weight:700!important;letter-spacing:-.04em!important}main{max-width:1600px!important;padding:28px clamp(14px,3vw,44px) 70px!important}h1{font-size:clamp(30px,3vw,42px)!important;letter-spacing:-.055em!important}h2{font-size:22px!important;letter-spacing:-.035em!important}p,.muted,small{color:var(--c-muted)!important}
button,.button{min-height:42px!important;border-radius:13px!important;border:1px solid transparent!important;background:var(--c-main)!important;color:var(--c-maintext)!important;font-weight:650!important;box-shadow:none!important;transition:transform .13s ease,filter .13s ease!important}button:active{transform:scale(.965)!important}button.secondary{background:rgba(255,255,255,.08)!important;color:var(--c-text)!important;border-color:var(--c-line)!important}button.danger{background:rgba(255,69,58,.12)!important;color:#ff6b63!important;border-color:rgba(255,69,58,.20)!important}.icon-button{width:42px!important;height:42px!important;padding:9px!important;border-radius:50%!important;background:rgba(255,255,255,.08)!important;color:var(--c-text)!important;border:1px solid var(--c-line)!important;backdrop-filter:blur(14px)}
input,select,textarea{min-height:44px!important;background:rgba(255,255,255,.06)!important;color:var(--c-text)!important;border:1px solid var(--c-line)!important;border-radius:13px!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:#0a84ff!important;box-shadow:0 0 0 4px rgba(10,132,255,.12)!important}.panel{background:var(--c-card)!important;border:1px solid var(--c-line)!important;border-radius:22px!important;box-shadow:none!important;backdrop-filter:blur(22px) saturate(150%)!important;-webkit-backdrop-filter:blur(22px) saturate(150%)!important}
body:has(.login){min-height:100vh;background:linear-gradient(rgba(4,7,10,.15),rgba(4,7,10,.42)),radial-gradient(1000px 660px at 50% 38%,rgba(110,140,175,.30),transparent 70%),linear-gradient(145deg,#64758a,#30445c 40%,#172431 72%,#0b1119)!important}html[data-theme=light] body:has(.login){background:linear-gradient(145deg,#d9e2ec,#9eafc2)!important}body:has(.login) header{background:transparent!important;border:0!important;backdrop-filter:none!important}.login{position:relative!important;max-width:380px!important;margin:13vh auto!important;padding:30px 28px!important;border-radius:28px!important;background:rgba(18,25,34,.42)!important;border:1px solid rgba(255,255,255,.16)!important;box-shadow:0 30px 90px rgba(0,0,0,.32)!important;backdrop-filter:blur(30px) saturate(145%)!important;-webkit-backdrop-filter:blur(30px) saturate(145%)!important}.login h1,.login>p,.login .muted{display:none!important}.login:before{content:"▶";display:grid;place-items:center;width:64px;height:64px;margin:0 auto 24px;border-radius:50%;font-size:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff}.login form{gap:12px!important}.login input{height:48px!important;border-radius:16px!important;background:rgba(255,255,255,.10)!important;padding:0 16px!important}.login form label{font-size:0!important}.login form label input{font-size:15px!important}.login button{height:48px!important;border-radius:16px!important;font-size:0!important}.login button:after{content:"→";font-size:23px}
.bar{gap:10px!important}.bar input{border-radius:999px!important;padding-inline:17px!important}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important;gap:26px 16px!important}.card{background:transparent!important}.card img{border-radius:16px!important;background:var(--c-card2)!important;box-shadow:0 12px 30px rgba(0,0,0,.24)!important;transition:.2s!important}.card:hover img{transform:translateY(-4px) scale(1.012)!important;box-shadow:0 18px 42px rgba(0,0,0,.34)!important}.card strong{font-size:14px!important;font-weight:650!important;color:var(--c-text)!important;margin:10px 2px 3px!important}.card .muted{font-size:12px!important;margin-left:2px!important}.library-card img{aspect-ratio:16/9!important;border-radius:18px!important}.badge{border:0!important;border-radius:999px!important;background:rgba(255,255,255,.09)!important;color:var(--c-text)!important}
dialog{background:rgba(10,14,20,.86)!important;color:var(--c-text)!important;border:1px solid var(--c-line)!important;border-radius:26px!important;box-shadow:var(--c-shadow)!important;backdrop-filter:blur(28px) saturate(150%)!important;-webkit-backdrop-filter:blur(28px) saturate(150%)!important;max-width:min(1040px,calc(100vw - 28px))!important;padding:26px!important}html[data-theme=light] dialog{background:rgba(247,249,252,.90)!important}dialog::backdrop{background:rgba(1,4,9,.68)!important;backdrop-filter:blur(10px)!important}.detail{grid-template-columns:190px 1fr!important;gap:28px!important}.detail>img{border-radius:18px!important;box-shadow:0 18px 40px rgba(0,0,0,.30)!important}.detail h2{font-size:clamp(26px,3vw,38px)!important}.detail button{border-radius:999px!important}.detail .actor img,.actor-placeholder{border-radius:14px!important}.media-info{border-color:var(--c-line)!important}.media-info article{background:rgba(255,255,255,.055)!important;border:1px solid var(--c-line)!important;border-radius:16px!important}
#drawer{top:66px!important;width:236px!important;padding:14px 10px!important;background:rgba(11,15,21,.80)!important;border-right:1px solid var(--c-line)!important;box-shadow:none!important;backdrop-filter:blur(26px) saturate(160%)!important;-webkit-backdrop-filter:blur(26px) saturate(160%)!important}html[data-theme=light] #drawer{background:rgba(245,248,252,.84)!important}#drawer button{min-height:43px!important;margin:3px 0!important;padding:10px 12px!important;border-radius:13px!important;background:transparent!important;color:var(--c-muted)!important}#drawer button:hover,#drawer button[aria-current=page]{background:rgba(255,255,255,.09)!important;color:var(--c-text)!important;border-color:transparent!important}.user-menu>div{background:var(--c-card2)!important;border:1px solid var(--c-line)!important;border-radius:18px!important;padding:8px!important;box-shadow:var(--c-shadow)!important;backdrop-filter:blur(24px)!important}.row{min-height:54px!important;padding:13px 4px!important;border-color:var(--c-line)!important;background:transparent!important;border-radius:0!important}.admin-tabs,.log-tabs{padding:4px!important;gap:4px!important;border-radius:14px!important;background:rgba(255,255,255,.055)!important;border:1px solid var(--c-line)!important}.admin-tabs button,.log-tabs button{background:transparent!important;color:var(--c-muted)!important;border-radius:10px!important;min-height:36px!important}.admin-tabs button.active,.admin-tabs button[aria-selected=true],.log-tabs [aria-selected=true]{background:rgba(255,255,255,.12)!important;color:var(--c-text)!important;outline:0!important}.toggle-label input:checked{background:#34c759!important}.log-entry{border-color:var(--c-line)!important;background:transparent!important}.empty{border:1px dashed var(--c-line)!important;border-radius:18px!important}
#ios-theme-toggle{position:fixed;right:16px;top:12px;z-index:90;width:42px;height:42px;min-height:42px;padding:0!important;border-radius:50%!important;display:grid;place-items:center;background:rgba(255,255,255,.09)!important;color:var(--c-text)!important;border:1px solid var(--c-line)!important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 24px rgba(0,0,0,.14)!important}#ios-theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){header{height:62px!important;padding:8px 62px 8px 12px!important}#drawer{top:62px!important}main{padding:20px 13px 52px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:19px 11px!important}.panel{border-radius:18px!important;padding:16px!important}.login{margin:16vh 16px 0!important;max-width:none!important;padding:26px 20px!important}.detail{grid-template-columns:1fr!important}.detail>img{max-width:150px!important}dialog{padding:18px!important;border-radius:22px!important}#ios-theme-toggle{top:10px;right:12px;width:40px;height:40px}}
'''
          js=r'''<script>(()=>{const k='go-emby-theme',r=document.documentElement,sys=()=>matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';function icon(){return r.dataset.theme==='dark'?'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2M20 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"/></svg>'}function draw(){let b=document.getElementById('ios-theme-toggle');if(!b){b=document.createElement('button');b.id='ios-theme-toggle';b.type='button';b.setAttribute('aria-label','切换明暗模式');b.onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';localStorage.setItem(k,r.dataset.theme);draw()};document.body.appendChild(b)}b.innerHTML=icon()}r.dataset.theme=localStorage.getItem(k)||sys();document.readyState==='loading'?document.addEventListener('DOMContentLoaded',draw,{once:true}):draw()})()</script>'''
          s=s.replace('</style>',css+'\n</style>',1).replace('</body>',js+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- web/index.html; then
            git add web/index.html
            git commit -m "Apply final iOS cinema UI"
            git push origin HEAD:main
          fi

# trigger 2026-09-15T10:25Z
