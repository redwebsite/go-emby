name: Apply final iOS cinema UI

on:
  push:
    paths:
      - ".github/workflows/ui-v2-final.yml"
      - ".github/ui/ios-cinema.css"
      - ".github/ui/ios-cinema.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text()
          marker='/* ios-cinema-final */'
          if marker not in s:
              css=Path('.github/ui/ios-cinema.css').read_text()
              js=Path('.github/ui/ios-cinema.js').read_text()
              s=s.replace('</head>', '<style>\n'+css+'\n</style></head>', 1)
              s=s.replace('</body>', '<script>\n'+js+'\n</script></body>', 1)
              p.write_text(s)
          PY
      - name: Commit UI
        run: |
          if git diff --quiet -- web/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Apply final iOS cinema UI"
          git push origin HEAD:main
