name: Apply iOS Emby UI v3

on:
  push:
    paths:
      - ".github/workflows/ui-v2-final.yml"
      - ".github/ui/ios-cinema-v3.css"
      - ".github/ui/ios-cinema-v3.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace previous injected theme with V3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/index.html')
          s=p.read_text()
          # Remove our previous injected V2 theme/style and switcher only; keep app/backend-facing DOM and logic untouched.
          s=re.sub(r'<style>\s*/\* ios-cinema-final \*/.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script>\s*/\* ios-cinema-theme-switch \*/.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<style>\s*/\* ios-cinema-v3 \*/.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script>\s*/\* ios-cinema-v3-js \*/.*?</script>', '', s, flags=re.S)
          css=Path('.github/ui/ios-cinema-v3.css').read_text()
          js=Path('.github/ui/ios-cinema-v3.js').read_text()
          s=s.replace('</head>', '<style>\n'+css+'\n</style>\n</head>', 1)
          s=s.replace('</body>', '<script>\n'+js+'\n</script>\n</body>', 1)
          p.write_text(s)
          PY
      - name: Commit V3
        run: |
          if git diff --quiet -- web/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Apply iOS Emby UI v3"
          git push origin HEAD:main
