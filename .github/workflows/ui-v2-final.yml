name: Apply true V5 template refactor

on:
  push:
    paths:
      - ".github/workflows/ui-v2-final.yml"
      - ".github/ui/apply_v5.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refactor web templates
        run: python3 .github/ui/apply_v5.py
      - name: Verify V5 and preserved contracts
        run: |
          grep -q 'ios-cinema-v5' web/index.html
          grep -q 'v5-login-page' web/index.html
          grep -q 'v5-home' web/index.html
          grep -q 'v5-detail-dialog' web/index.html
          grep -q '/emby/Users/AuthenticateByName' web/index.html
          grep -q '/PlaybackInfo' web/index.html
          grep -q '/admin/libraries' web/index.html
          grep -q 'showLogs' web/index.html
      - name: Commit V5 web index
        run: |
          if git diff --quiet -- web/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Apply true V5 template refactor"
          git push origin HEAD:main
